name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: "Install the amd64 audio build dependency (drop with oto v3.5, #39)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: "Install the arm64 cross toolchain and ALSA headers (drop with oto v3.5, #39)"
        run: |
          set -eux
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^URIs:|Architectures: amd64\nURIs:|' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $codename $codename-updates
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HUM_RELEASE_LINUX: "1"
        run: goreleaser release --clean
