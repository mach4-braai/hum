name: Release

on:
  push:
    branches: [master]
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  snapshot:
    name: snapshot
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          cache: false

      - name: "Install the audio and cross-compilation packages (drop with oto v3.5, #39)"
        uses: ./.github/actions/linux-packages

      - name: Snapshot
        env:
          HUM_RELEASE_LINUX: "1"
        run: mise run snapshot

  check:
    name: check
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          cache: false

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  windows:
    name: windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          cache: false

      - run: go vet ./...

      - name: Serve and stop a real daemon
        shell: bash
        run: |
          set -eu
          mise run build
          export HUM_HOME="$RUNNER_TEMP/hh"
          export HUM_SOCKET="$HUM_HOME/humd.sock"
          mkdir -p "$HUM_HOME"
          ./bin/humd.exe --no-audio --log-level debug &
          for _ in $(seq 100); do [ -e "$HUM_SOCKET" ] && break; sleep 0.2; done
          ./bin/hum.exe status
          ./bin/hum.exe stop
          test ! -e "$HUM_SOCKET" || { echo "the socket outlived the daemon" >&2; exit 1; }

  release:
    name: release
    needs: [check, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # goreleaser creates the draft release and uploads its assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14
        with:
          cache: false

      - name: "Install the audio and cross-compilation packages (drop with oto v3.5, #39)"
        uses: ./.github/actions/linux-packages

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          HUM_RELEASE_LINUX: "1"
        run: goreleaser release --clean
