name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: "Install the audio and cross-compilation packages (drop with oto v3.5, #39)"
        uses: ./.github/actions/linux-packages

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          HUM_RELEASE_LINUX: "1"
        run: goreleaser release --clean

  tap:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    concurrency:
      group: tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Mint a token scoped to the tap alone
        id: tap-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ github.repository_owner }}/homebrew-tap
          token: ${{ steps.tap-token.outputs.token }}
          path: tap

      - name: Bump the formula in the tap
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          version="${TAG#v}"
          archive="hum_${version}_source.tar.gz"

          current=""
          if [ -f tap/Formula/hum.rb ]; then
            current=$(sed -n 's|^  url ".*/hum_\(.*\)_source\.tar\.gz"$|\1|p' tap/Formula/hum.rb)
          fi
          newest=$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -1)
          if [ "$newest" != "$version" ]; then
            echo "the tap carries hum $current, which is newer than $version"
            exit 0
          fi

          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern checksums.txt --output checksums.txt --clobber
          sha=$(awk -v want="$archive" '$2 == want { print $1 }' checksums.txt)
          rm -f checksums.txt
          if [ -z "$sha" ]; then
            echo "the $TAG release publishes no checksum for $archive" >&2
            exit 1
          fi

          mkdir -p tap/Formula
          sed \
            -e "s|^  url .*|  url \"https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/$archive\"|" \
            -e "s|^  sha256 .*|  sha256 \"$sha\"|" \
            Formula/hum.rb >tap/Formula/hum.rb

          cd tap
          git add Formula/hum.rb
          if git diff --cached --quiet; then
            echo "the tap already carries hum $version"
            exit 0
          fi

          bot=$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)
          git config user.name "$APP_SLUG[bot]"
          git config user.email "$bot+$APP_SLUG[bot]@users.noreply.github.com"
          git commit -m "Bump hum to $version"
          git pull --rebase
          git push
