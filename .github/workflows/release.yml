name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha256: ${{ steps.meta.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@v4

      - name: "Install the amd64 audio build dependency (drop with oto v3.5, #39)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: "Install the arm64 cross toolchain and ALSA headers (drop with oto v3.5, #39)"
        run: |
          set -eux
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo dpkg --add-architecture arm64
          sudo sed -i 's|^URIs:|Architectures: amd64\nURIs:|' /etc/apt/sources.list.d/ubuntu.sources
          sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports/
          Suites: $codename $codename-updates
          Components: main universe
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libasound2-dev:arm64

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUM_RELEASE_LINUX: "1"
        run: goreleaser release --clean

      - name: Record the source archive checksum for the formula bump
        id: meta
        run: |
          set -eu
          version="${GITHUB_REF_NAME#v}"
          line=$(grep "_source.tar.gz$" dist/checksums.txt)
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "sha256=${line%% *}" >>"$GITHUB_OUTPUT"

  formula:
    needs: release
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - uses: actions/checkout@v7

      - name: Push the formula bump to the tap
        env:
          GH_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          SHA256: ${{ needs.release.outputs.sha256 }}
        run: |
          set -eu
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping the formula bump" >&2
            exit 1
          fi
          git clone "https://x-access-token:$GH_TOKEN@github.com/mach4-braai/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed \
            -e "s|^  url .*|  url \"https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/hum_${VERSION}_source.tar.gz\"|" \
            -e "s|^  sha256 .*|  sha256 \"${SHA256}\"|" \
            Formula/hum.rb >tap/Formula/hum.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/hum.rb
          git commit -m "Bump hum to ${VERSION}"
          git push
