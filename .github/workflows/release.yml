name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: "Install the audio and cross-compilation packages (drop with oto v3.5, #39)"
        uses: ./.github/actions/linux-packages

      - name: Release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}
          HUM_RELEASE_LINUX: "1"
        run: goreleaser release --clean
