name: CI

on:
  push:
    branches: [master]
  pull_request:

# Supersede stale runs, so an older one cannot report after a fresher one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # oto/v3 v3.4.0 builds CGO-free on macOS but declares "#cgo pkg-config: alsa"
    # on Linux, so both platforms must be covered.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # Installs the Go toolchain pinned in mise.toml, and trusts the config.
      # actions/setup-go is avoided: an independent Go version would defeat the pin.
      - uses: jdx/mise-action@v4

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # oto/v3 v3.4.0 links ALSA through cgo on Linux; pkg-config resolves its
      # "#cgo pkg-config: alsa" directive. Remove alongside the oto v3.5 upgrade in #39.
      - name: Install Linux audio build dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  # A separate job, so coverage reports as its own status check. Single-platform:
  # the total is identical on both, and check already covers cross-platform builds.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Cache Go modules
        uses: actions/cache@v6
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      # Same cgo ALSA dependency as the check job; removed alongside #39.
      - name: Install Linux audio build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      # The per-function table lands in the job summary either way, so a failing
      # check names the under-covered functions without reopening the log.
      - name: Enforce the coverage minimum
        run: |
          status=0
          mise run coverage >coverage.txt 2>&1 || status=$?
          {
            echo '### Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat coverage.txt
          exit $status
