name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

      - name: Verify the systemd user unit
        if: runner.os == 'Linux'
        run: |
          PREFIX="$HOME/.local" mise run install
          install -Dm644 contrib/systemd/humd.service "$HOME/.config/systemd/user/humd.service"
          systemd-analyze --user verify "$HOME/.config/systemd/user/humd.service"

  windows:
    name: windows
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - run: go vet ./...

      - name: Vet the other Windows architecture
        if: matrix.os == 'windows-latest'
        run: go vet ./...
        env:
          GOARCH: arm64

      - name: Serve and stop a real daemon
        shell: bash
        run: |
          set -eu
          mise run build
          export HUM_HOME="$RUNNER_TEMP/hh"
          export HUM_SOCKET="$HUM_HOME/humd.sock"
          mkdir -p "$HUM_HOME"
          ./bin/humd.exe --no-audio --log-level debug &
          for _ in $(seq 100); do [ -e "$HUM_SOCKET" ] && break; sleep 0.2; done
          ./bin/hum.exe status
          ./bin/hum.exe start --id ci --title "windows leg"
          ./bin/hum.exe status --json
          ./bin/hum.exe stop
          test ! -e "$HUM_SOCKET" || { echo "the socket outlived the daemon" >&2; exit 1; }

  e2e:
    name: e2e
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run e2e

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # authenticates the Codecov upload, which a protected branch requires
      statuses: write # posts the coverage/total commit status
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Enforce the coverage minimum
        id: measure
        run: |
          status=0
          mise run coverage >coverage.log 2>coverage.err || status=$?
          summary=$(tail -n 1 coverage.log)
          case "$summary" in
            *"of statements, minimum"*) ;;
            *) summary="coverage could not be measured" ;;
          esac
          {
            echo '### Coverage'
            echo '```'
            cat coverage.log coverage.err
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat coverage.log coverage.err
          {
            echo "summary=$summary"
            echo "state=$(test "$status" -eq 0 && echo success || echo failure)"
          } >>"$GITHUB_OUTPUT"
          exit $status

      - name: Upload the profile to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: always()
        with:
          files: coverage.out
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

      - name: Publish the measured total
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.measure.outputs.state || 'failure' }}
          SUMMARY: ${{ steps.measure.outputs.summary || 'coverage could not be measured' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context=coverage/total \
            -f description="$SUMMARY" \
            -f target_url="$RUN_URL"

      - name: Run tests and record JUnit results
        if: ${{ !cancelled() }}
        run: mise run junit
        continue-on-error: true

      - name: Upload JUnit results to Codecov
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3
        if: ${{ !cancelled() }}
        with:
          files: junit.xml
          use_oidc: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          fail_ci_if_error: false

  vuln:
    name: vuln
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run vuln

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654

      - name: Cache the Go modules and the compiler output
        uses: ./.github/actions/go-cache

      - run: mise run fuzz
        env:
          FUZZTIME: 30s
