name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  packages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: ./.github/actions/linux-packages

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - run: mise run check

  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14

      - name: Cache Go modules
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: ${{ runner.os }}-go-

      - name: "Install Linux audio build dependency (drop with oto v3.5, #39)"
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev pkg-config

      - name: Enforce the coverage minimum
        id: measure
        run: |
          status=0
          mise run coverage >coverage.log 2>coverage.err || status=$?
          summary=$(tail -n 1 coverage.log)
          case "$summary" in
            *"of statements, minimum"*) ;;
            *) summary="coverage could not be measured" ;;
          esac
          {
            echo '### Coverage'
            echo '```'
            cat coverage.log coverage.err
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
          cat coverage.log coverage.err
          {
            echo "summary=$summary"
            echo "state=$(test "$status" -eq 0 && echo success || echo failure)"
          } >>"$GITHUB_OUTPUT"
          exit $status

      - name: Publish the measured total
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          STATE: ${{ steps.measure.outputs.state || 'failure' }}
          SUMMARY: ${{ steps.measure.outputs.summary || 'coverage could not be measured' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh api "repos/$REPO/statuses/$SHA" \
            -f state="$STATE" \
            -f context=coverage/total \
            -f description="$SUMMARY" \
            -f target_url="$RUN_URL"
