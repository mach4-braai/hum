name: Linux build packages
description: Install the ALSA headers and the aarch64 cross toolchain from a cached deb archive

runs:
  using: composite
  steps:
    - name: Identify the runner image
      id: image
      shell: bash
      run: |
        set -eu
        codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
        echo "codename=$codename" >>"$GITHUB_OUTPUT"
        echo "key=apt-$codename-${ImageVersion:-run-$GITHUB_RUN_ID}-alsa-aarch64" >>"$GITHUB_OUTPUT"

    - name: Cache the Linux build packages
      id: packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ~/hum-apt
        key: ${{ steps.image.outputs.key }}

    - name: Install the packages
      shell: bash
      env:
        DOWNLOAD: ${{ steps.packages.outputs.cache-hit != 'true' }}
        CODENAME: ${{ steps.image.outputs.codename }}
      run: |
        set -eux
        archive="$HOME/hum-apt"
        mkdir -p "$archive/partial"
        sudo dpkg --add-architecture arm64
        sudo sed -i 's|^URIs:|Architectures: amd64\nURIs:|' /etc/apt/sources.list.d/ubuntu.sources
        sudo tee /etc/apt/sources.list.d/arm64-ports.sources >/dev/null <<EOF
        Types: deb
        URIs: http://ports.ubuntu.com/ubuntu-ports/
        Suites: $CODENAME $CODENAME-updates
        Components: main universe
        Architectures: arm64
        Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
        EOF
        if [ "$DOWNLOAD" = true ]; then
          sudo apt-get update
          sudo apt-get install -y --download-only \
            -o Acquire::Retries=3 -o Dir::Cache::archives="$archive" \
            libasound2-dev pkg-config gcc-aarch64-linux-gnu libasound2-dev:arm64
          sudo chown -R "$(id -u):$(id -g)" "$archive"
        fi
        sudo dpkg -i "$archive"/*.deb
