[tools]
go = "1.25.12"
goreleaser = "2.17.1"
gotestsum = "1.13.0"
syft = "1.50.0"
"go:github.com/avito-tech/go-mutesting/cmd/go-mutesting" = "0.0.0-20251226130216-48d0401f00fb"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.6.0"

[tasks.build]
description = "Build hum and humd into bin/"
shell = "bash -c"
run = '''
set -eu
version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)
commit=$(git rev-parse --short HEAD 2>/dev/null || echo none)
date=$(date -u +%Y-%m-%dT%H:%M:%SZ)
LDFLAGS="-X main.version=$version -X main.commit=$commit -X main.date=$date"
exe=$(go env GOEXE)
go build -trimpath -ldflags "$LDFLAGS" -o "bin/hum$exe" ./cmd/hum
go build -trimpath -ldflags "$LDFLAGS" -o "bin/humd$exe" ./cmd/humd
'''

[tasks.snapshot]
description = "Build a local snapshot release into dist/"
run = "goreleaser release --snapshot --clean"

[tasks.test]
description = "Run the unit test suite"
run = "go test ./..."

[tasks.e2e]
description = "Run the end-to-end acceptance suite against the real binaries"
run = "go test -tags e2e -count=1 ./e2e/..."

[tasks.coverage]
description = "Run the unit tests under coverage and enforce that every statement runs"
run = '''
set -eu
MINIMUM=100
UNEXERCISABLE='internal/audio/format.go:26\.'
MODULE=$(go list -m)
go test -covermode=atomic -coverpkg="$MODULE/..." -coverprofile=coverage.out ./...
go tool cover -func=coverage.out
awk -v skip="$UNEXERCISABLE" 'NR > 1 {
  if ($1 ~ skip) next
  statements[$1] = $2
  hits[$1] += $3
}
END {
  for (block in statements) {
    if (statements[block] + 0 > 0 && hits[block] + 0 == 0) {
      printf "never executed: %s\n", block > "/dev/stderr"
      dead++
    }
  }
  if (dead) {
    printf "%d block(s) never execute; the percentage below rounds them away\n", dead > "/dev/stderr"
    exit 1
  }
}' coverage.out
total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $3 }' | tr -d '%')
awk -v total="$total" -v minimum="$MINIMUM" 'BEGIN {
  below = (total + 0 < minimum + 0)
  if (below) {
    printf "coverage %s%% is below the %s%% minimum\n", total, minimum > "/dev/stderr"
  }
  printf "%s%% of statements, minimum %s%%\n", total, minimum
  exit below
}'
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.vuln]
description = "Scan the call graph for known vulnerabilities"
run = "govulncheck ./..."

[tasks.fuzz]
description = "Fuzz the protocol decoder against untrusted input"
run = "go test -run '^$' -fuzz FuzzDecoder -fuzztime ${FUZZTIME:-30s} ./internal/protocol/"

[tasks.mutate]
description = "Mutate the two packages that carry the logic and fail on a mutant no test notices"
shell = "bash -c"
run = '''
set -eu
EQUIVALENT=25
HUNG=3
BUDGET=10
snapshot=$(mktemp -d)
trap 'rm -rf "$snapshot"' EXIT
sources="$snapshot/.sources"
git ls-files -z --cached --others --exclude-standard >"$sources"
tar -cf - --null -T "$sources" | tar -xf - -C "$snapshot"
rm "$sources"
cd "$snapshot"
go-mutesting --exec "bash scripts/mutate-exec.sh" --exec-timeout="$BUDGET" ./internal/harmony/ ./internal/protocol/ | tee mutate.log
awk -v equivalent="$EQUIVALENT" -v budgeted="$HUNG" -v budget="$BUDGET" '
function judge(actual, expected, tooMany, tooFew) {
  if (actual > expected) {
    printf "%d %s\n", actual - expected, tooMany > "/dev/stderr"
    return 1
  }
  if (actual < expected) {
    printf "%d %s\n", expected - actual, tooFew > "/dev/stderr"
    return 1
  }
  return 0
}
/UNKOWN exit code/ { hung++ }
/^The mutation score is/ {
  scored = 1
  killed = $6
  escaped = $8
  skipped = $12
  total = $NF
  gsub(/[^0-9]/, "", killed)
  gsub(/[^0-9]/, "", escaped)
  gsub(/[^0-9]/, "", skipped)
  gsub(/[^0-9]/, "", total)
}
END {
  if (!scored) {
    print "no mutation score was reported; the run did not finish" > "/dev/stderr"
    exit 1
  }
  failed = judge(escaped + 0, equivalent + 0, "mutant(s) changed behaviour and no test failed", "fewer mutant(s) survive than EQUIVALENT claims; lower it")
  failed += judge(hung + 0, budgeted + 0, "mutant(s) hung a test rather than failing it, so the suite notices only by running out of its " budget "s budget", "fewer mutant(s) hang than HUNG claims; lower it")
  printf "%d of %d mutants killed, %d survived, %d hung, %d never compiled\n", killed, total, escaped, hung + 0, skipped
  exit (failed > 0)
}' mutate.log
'''

[tasks.junit]
description = "Run the unit tests and write a JUnit report for test analytics"
run = "gotestsum --junitfile junit.xml --format pkgname -- -count=1 ./..."

[tasks.fmt]
description = "Format all Go source in place"
run = "find . -path ./.gocache -prune -o -name '*.go' -print0 | xargs -0 gofmt -w"

[tasks.check]
description = "Formatting, vet, unit tests and build-tooling assertions"
shell = "bash -c"
run = '''
set -eu
unformatted=$(find . -path ./.gocache -prune -o -name '*.go' -print0 | xargs -0 gofmt -l)
if [ -n "$unformatted" ]; then
  echo "unformatted files:" >&2
  echo "$unformatted" >&2
  exit 1
fi
go vet ./...
go test ./...
'''

[tasks.install]
description = "Install both binaries into $PREFIX/bin (default /usr/local)"
run = '''
set -eu
PREFIX="${PREFIX:-/usr/local}"
DESTDIR="${DESTDIR:-}"
mise run build
mkdir -p "$DESTDIR$PREFIX/bin"
install -m 0755 bin/hum "$DESTDIR$PREFIX/bin/hum"
install -m 0755 bin/humd "$DESTDIR$PREFIX/bin/humd"
'''

[tasks.clean]
description = "Remove build output"
run = "rm -rf bin dist coverage.out"
