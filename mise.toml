# GoReleaser and the Homebrew formula cannot use mise, so they duplicate the
# ldflags defined here; internal/infra asserts the copies stay in sync.

[tools]
# Exact patch, not a floating "1.24": that resolves differently per machine,
# which is what this pin exists to prevent. oto/v3 needs >= 1.24.0.
go = "1.24.13"

[env]
HUM_VERSION = "{{ exec(command='git describe --tags --always --dirty 2>/dev/null || echo dev') }}"
HUM_COMMIT = "{{ exec(command='git rev-parse --short HEAD 2>/dev/null || echo none') }}"
HUM_DATE = "{{ exec(command='date -u +%Y-%m-%dT%H:%M:%SZ') }}"

[tasks.build]
description = "Build hum and humd into bin/"
run = '''
set -eu
LDFLAGS="-X main.version=$HUM_VERSION -X main.commit=$HUM_COMMIT -X main.date=$HUM_DATE"
go build -trimpath -ldflags "$LDFLAGS" -o bin/hum ./cmd/hum
go build -trimpath -ldflags "$LDFLAGS" -o bin/humd ./cmd/humd
'''

[tasks.test]
description = "Run the unit test suite"
run = "go test ./..."

# A fixed floor: it bounds erosion but does not follow coverage upwards. Raise
# it by hand as coverage rises, and lower it only deliberately.
[tasks.coverage]
description = "Run the unit tests under coverage and enforce the minimum"
run = '''
set -eu
MINIMUM=98
# -coverpkg credits cross-package execution, so a package covered only by
# another package's test still counts.
go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
go tool cover -func=coverage.out
total=$(go tool cover -func=coverage.out | awk '$1 == "total:" { print $3 }' | tr -d '%')
# CI publishes this last stdout line verbatim as the coverage status
# description, so it states both numbers and prints in either outcome.
awk -v total="$total" -v minimum="$MINIMUM" 'BEGIN {
  below = (total + 0 < minimum + 0)
  if (below) {
    printf "coverage %s%% is below the %s%% minimum\n", total, minimum > "/dev/stderr"
  }
  printf "%s%% of statements, minimum %s%%\n", total, minimum
  exit below
}'
'''

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.fmt]
description = "Format all Go source in place"
run = "gofmt -w ."

[tasks.check]
description = "Formatting, vet, unit tests and build-tooling assertions"
run = '''
set -eu
unformatted=$(gofmt -l .)
if [ -n "$unformatted" ]; then
  echo "unformatted files:" >&2
  echo "$unformatted" >&2
  exit 1
fi
go vet ./...
go test ./...
'''

[tasks.install]
description = "Install both binaries into $PREFIX/bin (default /usr/local)"
run = '''
set -eu
PREFIX="${PREFIX:-/usr/local}"
DESTDIR="${DESTDIR:-}"
mise run build
mkdir -p "$DESTDIR$PREFIX/bin"
install -m 0755 bin/hum "$DESTDIR$PREFIX/bin/hum"
install -m 0755 bin/humd "$DESTDIR$PREFIX/bin/humd"
'''

[tasks.clean]
description = "Remove build output"
run = "rm -rf bin dist coverage.out"
